name: Security Intelligence Demo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-demo:
    name: Run Synthetic Dataset Tests & CLI Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Synthetic Datasets Referential Integrity
        run: npm run validate:data

      - name: Execute Deterministic Risk Engine Unit Tests
        run: npm test

      - name: Execute Reference Security Intelligence Demo
        run: npm run demo
